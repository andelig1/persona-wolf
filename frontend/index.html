<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单人狼人杀 - Solo Werewolf</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="moon">
        <div class="moon-crater"></div>
        <div class="moon-crater"></div>
        <div class="moon-crater"></div>
    </div>

    <!-- ======== 右上角设置齿轮 ======== -->
    <button class="gear-btn" id="gear-btn" onclick="Settings.open()" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </button>

    <!-- ======== 开始界面 ======== -->
    <div class="start-screen" id="start-screen">
        <div class="start-content">
            <div class="subtitle">Solo Werewolf Game</div>
            <h1 class="main-title">单人狼人杀</h1>
            <div class="tagline">Multi-Agent 人格博弈系统</div>
            <div class="wolf-icon">🐺</div>

            <div id="player-selection" style="margin: 30px 0;">
                <div style="color: #a78bfa; font-size: 14px; margin-bottom: 15px;">👥 选择玩家人数</div>
                <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                    <button class="player-btn" onclick="selectPlayers(6)">6人局</button>
                    <button class="player-btn" onclick="selectPlayers(7)">7人局</button>
                    <button class="player-btn" onclick="selectPlayers(8)">8人局</button>
                    <button class="player-btn" onclick="selectPlayers(9)">9人局</button>
                    <button class="player-btn" onclick="selectPlayers(10)">10人局</button>
                </div>
                <div id="role-config-display" style="margin-top: 20px; font-size: 12px; color: #8888aa;"></div>
            </div>

            <div id="role-selection" style="margin: 30px 0; display: none;">
                <div style="color: #a78bfa; font-size: 14px; margin-bottom: 15px;">🎭 选择你的角色</div>
                <div id="available-roles" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;"></div>
            </div>

            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button class="start-btn" onclick="startGame()" id="start-btn" disabled>开始游戏</button>
                <button class="start-btn start-btn-ghost" onclick="startSpectate()" id="spectate-btn">👁 观战模式</button>
            </div>
            <div class="start-info">与 AI 玩家一起体验狼人杀的魅力，或作为观众旁观 AI 对局</div>
        </div>
    </div>

    <!-- ======== 游戏主界面 ======== -->
    <div class="container" id="game-container" style="display: none;">
        <div class="header">
            <div class="subtitle">Solo Werewolf Game</div>
            <h1 class="main-title">单人狼人杀</h1>
        </div>

        <div class="game-wrapper">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <div class="status-card">
                    <h3>📊 游戏状态</h3>
                    <div class="day-info">第 <span id="day-num">1</span> 天</div>
                    <div id="phase-display" class="phase-badge phase-night">🌙 夜晚</div>
                    <div id="winner-area"></div>
                </div>

                <div class="players-section">
                    <h3>👥 玩家列表</h3>
                    <div class="player-list" id="player-list"></div>
                </div>
            </div>

            <!-- 右侧主区域 -->
            <div class="main-area">
                <div class="speech-card" id="speech-card">
                    <h3>💬 发言记录</h3>
                    <div class="speech-content" id="speech-content"></div>
                </div>

                <div class="action-card" id="action-card">
                    <h3 id="action-title">🌙 夜晚操作</h3>
                    <div id="action-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== 游戏结束弹窗 ======== -->
    <div class="game-over-overlay" id="game-over-overlay" style="display: none;">
        <div class="game-over-modal">
            <div class="game-over-title">🎉 游戏结束</div>
            <div class="game-over-winner" id="game-over-winner">胜利者: 狼人</div>
            <div class="game-over-role" id="game-over-role">你的身份: 狼人</div>
            <div style="margin-top: 20px;">
                <div style="font-size: 16px; color: #c084fc; margin-bottom: 10px;">🎭 所有玩家身份:</div>
                <div id="game-over-roles" style="text-align: left; padding-left: 20px;"></div>
            </div>
            <button class="restart-btn" onclick="restartGame()" style="margin-top: 30px;">再来一局</button>
        </div>
    </div>

    <script src="js/roles/werewolf.js"></script>
    <script src="js/roles/seer.js"></script>
    <script src="js/roles/witch.js"></script>
    <script src="js/roles/villager.js"></script>
    <script src="js/game.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
